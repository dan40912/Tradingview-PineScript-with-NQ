<title>NQ 紙上交易練習</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 交易台——左邊是回放圖，右邊是一張隨步驟換內容的「單據」，下面是練習紀錄。 */
:root{
  --bg:#e9edf1; --panel:#fbfcfd; --panel2:#f2f5f8; --ink:#16202a; --muted:#5b6977; --line:#d3dae1; --grid:#e2e7ec;
  --accent:#b86a12; --accent-ink:#ffffff; --up:#11875a; --down:#c63f37; --gray:#8794a1; --vwap:#7357c4; --va:#2e78ad; --lvl:#9a6a2c; --cursor:#b86a12;
  --up-bg:#e3f3ec; --down-bg:#f8e6e4; --warn-bg:#fbefdc; --shadow:0 1px 2px rgba(20,32,44,.06),0 6px 18px rgba(20,32,44,.06);
  --f-body:"IBM Plex Sans","Noto Sans TC",system-ui,sans-serif; --f-head:"IBM Plex Sans Condensed","Noto Sans TC",system-ui,sans-serif; --f-mono:"IBM Plex Mono","Noto Sans TC",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d131a; --panel:#141c25; --panel2:#18212c; --ink:#e3e9ef; --muted:#93a1ae; --line:#263241; --grid:#1b2530;
  --accent:#e09a3e; --accent-ink:#1a1206; --up:#3dbd85; --down:#eb6a61; --gray:#7d8a97; --vwap:#a68cf0; --va:#5aa6dc; --lvl:#c99a58; --cursor:#e09a3e;
  --up-bg:#12291f; --down-bg:#2d1817; --warn-bg:#2b2112; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d131a; --panel:#141c25; --panel2:#18212c; --ink:#e3e9ef; --muted:#93a1ae; --line:#263241; --grid:#1b2530;
  --accent:#e09a3e; --accent-ink:#1a1206; --up:#3dbd85; --down:#eb6a61; --gray:#7d8a97; --vwap:#a68cf0; --va:#5aa6dc; --lvl:#c99a58; --cursor:#e09a3e;
  --up-bg:#12291f; --down-bg:#2d1817; --warn-bg:#2b2112; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:1360px;margin:0 auto;display:grid;gap:14px}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:22px;font-weight:700}
h2{font-size:17px;font-weight:600}
h3{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;min-height:36px}
button:hover:not(:disabled){border-color:var(--muted)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.buy{background:var(--up);border-color:var(--up);color:#fff;font-weight:600}
button.sell{background:var(--down);border-color:var(--down);color:#fff;font-weight:600}
button.ghost{background:transparent}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-height:36px}
input[type=number]{width:100%}
label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand .tag{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.steps{display:flex;gap:4px;flex-wrap:wrap;list-style:none;margin:0;padding:3px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
.steps li{font-size:13px;padding:5px 11px;border-radius:7px;color:var(--muted);display:flex;gap:6px;align-items:center}
.steps li b{font-family:var(--f-mono);font-weight:500;font-size:12px}
.steps li.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.steps li.done{color:var(--ink)}
.topbtns{display:flex;gap:8px;flex-wrap:wrap}

/* main */
.main{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:14px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.chartcard{display:grid;min-width:0}
.chartbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
.clock{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.clock .t{font-family:var(--f-mono);font-size:22px;font-weight:600}
.clock .p{font-family:var(--f-mono);font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);white-space:nowrap}
.chip.hot{background:var(--warn-bg);border-color:var(--accent);color:var(--ink)}
.chip.up{background:var(--up-bg);border-color:var(--up)}
.chip.down{background:var(--down-bg);border-color:var(--down)}
.canvaswrap{position:relative;height:min(62vh,560px);min-height:340px}
canvas{display:block;width:100%;height:100%}
.hover{position:absolute;left:10px;top:8px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);background:color-mix(in srgb,var(--panel) 85%,transparent);padding:2px 6px;border-radius:6px;pointer-events:none}
.transport{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.transport .sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:34px;background:var(--panel)}
.seg button.on{background:var(--ink);color:var(--panel)}

/* side ticket */
.ticket{display:grid;gap:0;min-width:0}
.sec{padding:14px 16px;border-bottom:1px solid var(--line);display:grid;gap:10px;min-width:0}
.sec:last-child{border-bottom:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:12.5px}
.levels div{display:flex;justify-content:space-between;gap:8px}
.levels span:first-child{color:var(--muted)}
.big{font-family:var(--f-mono);font-size:28px;font-weight:600;line-height:1.1}
.check{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--ink)}
.check input{min-height:auto;width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
.banner{border-radius:10px;padding:10px 12px;display:grid;gap:6px;font-size:13.5px;border:1px solid var(--line);background:var(--panel2)}
.banner.up{background:var(--up-bg);border-color:var(--up)}
.banner.down{background:var(--down-bg);border-color:var(--down)}
.banner.obs{background:var(--panel2);border-style:dashed}
.banner.lock{background:var(--down-bg);border-color:var(--down);font-weight:600}
.banner.warn{background:var(--warn-bg);border-color:var(--accent)}
.banner .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pos{display:grid;gap:4px;font-size:13px}
.pos .pl{font-family:var(--f-mono);font-size:20px;font-weight:600}
.up-t{color:var(--up)} .down-t{color:var(--down)}
.log{max-height:170px;overflow:auto;display:grid;gap:3px;font-size:12.5px}
.log div{display:grid;grid-template-columns:44px 1fr;gap:8px}
.log time{font-family:var(--f-mono);color:var(--muted)}
.rules{font-size:12.5px;color:var(--muted);display:grid;gap:3px;margin:0;padding-left:18px}

/* review + journal */
.review{padding:16px;display:grid;gap:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel2);display:grid;gap:2px}
.tile .v{font-family:var(--f-mono);font-size:20px;font-weight:600}
.tile .l{font-size:12px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500}
td.r,th.r{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.vio{color:var(--down);font-size:12px}
.okb{color:var(--up);font-size:12px}
textarea{width:100%;min-height:70px;resize:vertical}
.journal{padding:16px;display:grid;gap:12px}
.jhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.empty{border:1px dashed var(--line);border-radius:10px;padding:16px;color:var(--muted);font-size:13.5px}
.settings{display:grid;gap:10px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:0;width:min(420px,calc(100vw - 32px));box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,16,22,.45)}
.dlg{padding:16px;display:grid;gap:12px}
.toggle{display:flex;gap:9px;align-items:center;color:var(--ink);font-size:13.5px}
.toggle input{width:18px;height:18px;min-height:auto;accent-color:var(--accent)}
.foot{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>NQ 紙上交易練習</h1>
      <span class="tag" id="dayTag">載入中…</span>
    </div>
    <ol class="steps" id="steps" aria-label="練習流程">
      <li data-s="pre"><b>1</b>盤前</li>
      <li data-s="play"><b>2</b>回放下單</li>
      <li data-s="review"><b>3</b>收盤檢討</li>
      <li data-s="saved"><b>4</b>存進紀錄</li>
    </ol>
    <div class="topbtns">
      <button id="btnNew" class="ghost">換一天</button>
      <button id="btnSettings" class="ghost">設定</button>
    </div>
  </header>

  <div class="main">
    <section class="card chartcard" aria-label="回放圖">
      <div class="chartbar">
        <div class="clock"><span class="t" id="clk">--:--</span><span class="p" id="px">—</span><span class="muted" id="pxchg"></span></div>
        <div class="chips" id="ctxChips"></div>
      </div>
      <div class="canvaswrap"><canvas id="cv"></canvas><div class="hover" id="hover" hidden></div></div>
      <div class="transport">
        <button id="btnPlay" class="primary" aria-label="播放">▶ 播放</button>
        <button data-step="1">+1 分</button>
        <button data-step="5">+5 分</button>
        <button data-step="15">+15 分</button>
        <button id="btnNextSig">下一個訊號 ⇥</button>
        <span class="sep"></span>
        <div class="seg" role="group" aria-label="速度">
          <button data-speed="1">1×</button><button data-speed="4" class="on">4×</button><button data-speed="15">15×</button><button data-speed="60">60×</button>
        </div>
        <div class="seg" role="group" aria-label="K 線週期">
          <button data-tf="1">1 分</button><button data-tf="5" class="on">5 分</button>
        </div>
        <span class="sep"></span>
        <button id="btnEnd" class="ghost">結束今天 → 檢討</button>
      </div>
    </section>

    <aside class="card ticket" id="ticket" aria-label="單據"></aside>
  </div>

  <section class="card" id="reviewCard" hidden><div class="review" id="review"></div></section>

  <section class="card"><div class="journal" id="journal"></div></section>

  <p class="foot">研究用途，不是投資建議。K 線是 NQ 1 分K 歷史資料（2024-01 ～ 2026-11-25，隨機抽 120 天，其中 40 天是超大波動日）。訊號是 v18「順勢多點」的模擬結果；損益以 MNQ 每點 $2、每口來回 $4.8 計算。同一分鐘同時碰到止盈和止損時算止損。</p>
</div>

<dialog id="dlg">
  <form class="dlg" method="dialog" id="setForm">
    <h2>練習設定</h2>
    <label for="setRisk">每筆最多虧多少（美元）
      <input id="setRisk" type="number" min="50" step="50" value="500">
    </label>
    <label class="toggle"><input id="setHint" type="checkbox" checked> 回放時顯示 v18 訊號</label>
    <label class="toggle"><input id="setPause" type="checkbox" checked> 訊號出現時自動暫停</label>
    <label class="toggle"><input id="setLock" type="checkbox" checked> 虧一筆就停止今天</label>
    <p class="foot">關掉「顯示訊號」可以練習自己判斷，收盤檢討時再對答案。</p>
    <div class="row" style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="ghost" onclick="this.closest('dialog').close()">取消</button><button value="ok" class="primary" id="setOk">套用</button></div>
  </form>
</dialog>

<script src="engine.js"></script>
<script>
(() => {
const E = window.PaperEngine;
const $ = s => document.querySelector(s);
const fmt = (v, d = 2) => v == null || isNaN(v) ? "—" : Number(v).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const usd = v => (v < 0 ? "−$" : "+$") + Math.abs(Math.round(v)).toLocaleString("en-US");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const WEEK = ["日", "一", "二", "三", "四", "五", "六"];
const KIND = { "I2": "I2 回價值區", "前低多": "前日低破底翻（多）", "前高空": "前日高假突破（空）", "早盤夜低多": "早盤夜低多", "亞洲前低多": "亞洲前低多", "亞洲VAL多": "亞洲 VAL 多", "C1": "C1 開盤動能", "TD10": "TD10 趨勢日" };
const kindName = k => KIND[k] || k;

// ---------- settings (per-viewer convenience) ----------
const S = { risk: 500, hint: true, pause: true, lock: true };
try { Object.assign(S, JSON.parse(localStorage.getItem("paper.settings") || "{}")); } catch (e) {}
const saveSettings = () => { try { localStorage.setItem("paper.settings", JSON.stringify(S)); } catch (e) {} };

// ---------- state ----------
let DAYS = [], day = null, bars = [], cur = 0, step = "pre", tf = 5, speed = 4, timer = null;
let trades = [], pending = null, events = [], shownSig = new Set(), locked = false, checks = [false, false, false];
let journal = [], store = null, hover = null;

// ---------- journal storage: db (private per viewer) with localStorage fallback ----------
const LKEY = "paper.journal";
async function initStore() {
  try {
    const [db, user] = await Promise.all([window.claude?.use?.("db"), window.claude?.use?.("user")]);
    const uid = user ? await user.id() : null;
    if (db && uid) {
      const col = db.collection("data/users/" + uid);
      store = { kind: "db", col };
      const t = setTimeout(() => { if (store.kind === "db" && !store.loaded) renderJournal("紀錄還在載入，可能暫時連不上。"); }, 10000);
      col.onSnapshot(snap => {
        store.loaded = true; clearTimeout(t);
        journal = snap.docs.map(d => Object.assign({ id: d.id }, d.data())).filter(r => r.td).sort((a, b) => b.at - a.at);
        renderJournal(); if (step === "pre" && !day) pickDay();
      }, () => { clearTimeout(t); fallbackStore(); });
      return;
    }
  } catch (e) {}
  fallbackStore();
}
function fallbackStore() {
  store = { kind: "local" };
  try { journal = JSON.parse(localStorage.getItem(LKEY) || "[]"); } catch (e) { journal = []; }
  renderJournal();
}
async function saveSession(rec) {
  if (store?.kind === "db") {
    try { await store.col.doc(rec.id).set(rec); return true; } catch (e) { if (e?.code !== "unavailable") { fallbackStore(); } else return false; }
  }
  journal = [rec, ...journal.filter(r => r.id !== rec.id)];
  try { localStorage.setItem(LKEY, JSON.stringify(journal)); } catch (e) {}
  renderJournal(); return true;
}
async function deleteSession(id) {
  if (store?.kind === "db") { try { await store.col.doc(id).delete(); return; } catch (e) {} }
  journal = journal.filter(r => r.id !== id);
  try { localStorage.setItem(LKEY, JSON.stringify(journal)); } catch (e) {}
  renderJournal();
}

// ---------- helpers ----------
const now = () => bars[cur];
const nowM = () => bars[cur].m + 1;                       // 這根收盤後的時間
const suggest = () => E.sizing(S.risk, 145, day.vm);
const realized = () => trades.filter(t => t.exitM != null).reduce((a, t) => a + t.pnl, 0);
const openTrades = () => trades.filter(t => t.exitM == null);
const idxOfM = m => bars.findIndex(b => b.m === m);
const sigVisible = s => s.m >= 420 && s.m - 1 <= bars[cur].m;
function vwapSeries() {
  const out = new Array(bars.length).fill(null); let pv = 0, vv = 0;
  for (let i = 0; i < bars.length; i++) { const b = bars[i]; if (b.m < 570) continue; const w = Math.max(b.v, 1); pv += (b.h + b.l + b.c) / 3 * w; vv += w; out[i] = pv / vv; }
  return out;
}
let VW = [];
function log(text, cls) { events.unshift({ m: bars[cur] ? nowM() : 0, text, cls }); }

// ---------- day ----------
function pickDay(forceNew) {
  const done = new Set(journal.map(r => r.td));
  let pool = DAYS.filter(d => !done.has(d.td));
  if (!pool.length) pool = DAYS;
  if (!forceNew && day && pool.includes(day)) return;
  const d = pool[Math.floor(Math.random() * pool.length)];
  loadDay(d);
}
function loadDay(d) {
  stop(); day = d; bars = E.decode(d); VW = vwapSeries();
  cur = 0; for (let i = 0; i < bars.length && bars[i].m <= 564; i++) cur = i;   // 停在 09:25
  trades = []; pending = null; events = []; shownSig = new Set(); locked = false; checks = [false, false, false];
  step = "pre"; $("#reviewCard").hidden = true;
  for (const s of d.sig) if (s.m >= 420 && s.m - 1 <= bars[cur].m) shownSig.add(s);
  renderAll();
}

// ---------- playback ----------
function stop() { if (timer) { clearInterval(timer); timer = null; } $("#btnPlay").textContent = "▶ 播放"; }
function play() {
  if (step === "pre") return;
  if (timer) return stop();
  $("#btnPlay").textContent = "❚❚ 暫停";
  timer = setInterval(() => { if (!advance(1)) stop(); }, Math.max(16, 1000 / speed));
}
function advance(n) {
  if (step !== "play") return false;
  for (let k = 0; k < n; k++) {
    if (cur >= bars.length - 1) { finishDay(); return false; }
    cur++;
    const b = bars[cur];
    if (pending) {               // 掛的市價單在這根開盤成交
      const t = Object.assign(pending, { entry: b.o, entryM: b.m });
      if (t.tpPts) t.tp = t.entry + t.dir * t.tpPts;
      if (t.slPts) t.sl = t.entry - t.dir * t.slPts;
      const rc = E.ruleCheck(day, t, { suggest: suggest().qty });
      t.violations = rc.violations; t.planKind = rc.plan ? rc.plan.kind : null;
      trades.push(t); pending = null;
      log(`${t.dir > 0 ? "做多" : "做空"} ${t.qty} 口成交 ${fmt(t.entry)}｜TP ${fmt(t.tp)}｜SL ${fmt(t.sl)}` + (t.violations.length ? `｜⚠ ${t.violations.join("、")}` : "｜✓ 符合計畫"), t.violations.length ? "vio" : "ok");
    }
    for (const t of openTrades()) {
      const r = E.stepTrade(t, b);
      if (r) closeTrade(t, r);
    }
    const sig = day.sig.find(s => s.m - 1 === b.m && !shownSig.has(s));
    if (sig) { shownSig.add(sig); if (S.hint) { log(sigText(sig), sig.plan ? "sig" : "obs"); if (S.pause) { stop(); renderAll(); return false; } } }
    if (b.m >= 959) { finishDay(); return false; }
  }
  renderAll(); return true;
}
function closeTrade(t, r) {

function placeOrder(dir, fromSig) {
  if (locked || step !== "play" || pending || cur >= bars.length - 1) return;
  const f = readTicket();
  pending = { dir, qty: f.qty, tpPts: f.tp, slPts: f.sl, tEnd: f.tEnd, fromSig: !!fromSig };
  log(`送出${dir > 0 ? "做多" : "做空"}市價單 ${f.qty} 口（下一根開盤成交）`);
  if (!timer) advance(1); else renderAll();
}

}
function readTicket() {
  const q = parseInt($("#tQty")?.value, 10), tp = parseFloat($("#tTp")?.value), sl = parseFloat($("#tSl")?.value), te = $("#tEnd")?.value || "749";
  return { qty: Math.max(1, isNaN(q) ? 1 : q), tp: isNaN(tp) || tp <= 0 ? null : tp, sl: isNaN(sl) || sl <= 0 ? null : sl, tEnd: parseInt(te, 10) };

  $("#px").textContent = fmt(b.c);
  const ch = b.c - lv.PDC; $("#pxchg").textContent = `${ch >= 0 ? "+" : ""}${fmt(ch)} 點（對前日收）`;
  $("#pxchg").className = ch >= 0 ? "up-t" : "down-t";

    nowM() > 690 && nowM() < 750 ? `<span class="chip">11:30 後計畫不再進場</span>` : "",

function renderAll() { renderSteps(); renderClock(); renderTicket(); draw(); }

// ---------- chart ----------
const cv = $("#cv"), ctx = cv.getContext("2d");

    else { a.h = Math.max(a.h, b.h); a.l = Math.min(a.l, b.l); a.c = b.c; a.v += b.v; a.i1 = i; } });

}
function draw() {
  if (!day) return;

  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }

  LV.forEach(([, v]) => { if (v > lo - R * 0.25 && v < hi + R * 0.25) { lo = Math.min(lo, v); hi = Math.max(hi, v); } });
  const ot = trades.filter(t => t.entryM != null); ot.forEach(t => { if (t.exitM == null) { lo = Math.min(lo, t.sl ?? lo, t.tp ?? lo); hi = Math.max(hi, t.sl ?? hi, t.tp ?? hi); } });
  const pad = (hi - lo) * 0.06 + 2; lo -= pad; hi += pad;
  const ys = p => padT + (hi - p) / (hi - lo) * ph;

  // 時間軸
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  const tStep = tf === 5 ? 60 : 30;
  for (let m = Math.ceil(m0 / tStep) * tStep; m <= m1; m += tStep) { const x = xs(m); ctx.strokeStyle = C.grid; ctx.beginPath(); ctx.moveTo(x + .5, padT); ctx.lineTo(x + .5, padT + ph); ctx.stroke(); ctx.fillStyle = C.muted; ctx.fillText(E.hhmm(m), x, padT + ph + 6); }

  // VWAP
  ctx.save(); ctx.strokeStyle = C.vwap; ctx.lineWidth = 1.4; ctx.beginPath(); let st = false;
  for (let i = 0; i <= cur; i++) { const v = VW[i]; if (v == null || bars[i].m < m0) continue; const x = xs(bars[i].m + .5), y = ys(v); if (!st) { ctx.moveTo(x, y); st = true; } else ctx.lineTo(x, y); }
  ctx.stroke(); ctx.restore(); if (VW[cur] != null) labels.push({ y: ys(VW[cur]), t: "VWAP", c: C.vwap });
  // K 線

  shown.forEach(b => { const x = xs(b.m + tf / 2); const upc = b.c >= b.o; ctx.strokeStyle = upc ? C.up : C.down; ctx.fillStyle = upc ? C.up : C.down; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x + .5, ys(b.h)); ctx.lineTo(x + .5, ys(b.l)); ctx.stroke();
    const y1 = ys(Math.max(b.o, b.c)), y2 = ys(Math.min(b.o, b.c)); ctx.fillRect(x - bw / 2, y1, bw, Math.max(1, y2 - y1)); });
  // 現在

  const yc = ys(now().c); ctx.fillStyle = C.cursor; ctx.fillRect(padL + pw + 1, yc - 9, padR - 2, 18); ctx.fillStyle = css("--accent-ink"); ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.font = "600 11px " + css("--f-mono"); ctx.fillText(fmt(now().c), padL + pw + 6, yc);
  // 訊號
  if (S.hint || step === "review" || step === "saved") day.sig.forEach(s => { if (s.m < m0 || s.m > m1 || !(sigVisible(s) || step !== "play" && step !== "pre")) return;
    const bi = idxOfM(s.m); if (bi < 0) return; const x = xs(s.m + .5); const bb = bars[bi];

  // 你的單
  trades.forEach(t => { if (t.entryM == null) return; const x0 = xs(t.entryM), x1 = xs(t.exitM != null ? t.exitM + 1 : nowM()); const col = t.dir > 0 ? C.up : C.down;
    if (t.exitM == null) { [[t.tp, C.up, "TP"], [t.sl, C.down, "SL"]].forEach(([p, c, k]) => { if (p == null) return; const y = ys(p); ctx.save(); ctx.setLineDash([6, 4]); ctx.strokeStyle = c; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(padL + pw, y); ctx.stroke(); ctx.restore(); labels.push({ y, t: k + " " + fmt(p, 0), c }); }); }
    const ye = ys(t.entry); ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x0, ye); ctx.lineTo(x1, t.exitM != null ? ys(t.exit) : ys(now().c)); ctx.stroke();
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x0, ye, 4, 0, Math.PI * 2); ctx.fill();

    const hv = $("#hover"); if (hb) { hv.hidden = false; hv.textContent = `${E.hhmm(hb.m)}  開 ${fmt(hb.o)}  高 ${fmt(hb.h)}  低 ${fmt(hb.l)}  收 ${fmt(hb.c)}`; } else hv.hidden = true; }
}
function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x))); const f = x / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; }

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
new MutationObserver(() => draw()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

// ---------- controls ----------
$("#btnPlay").onclick = play;
document.querySelectorAll("[data-step]").forEach(b => b.onclick = () => { stop(); advance(+b.dataset.step); });
document.querySelectorAll("[data-speed]").forEach(b => b.onclick = () => { speed = +b.dataset.speed; document.querySelectorAll("[data-speed]").forEach(x => x.classList.toggle("on", x === b)); if (timer) { stop(); play(); } });
document.querySelectorAll("[data-tf]").forEach(b => b.onclick = () => { tf = +b.dataset.tf; document.querySelectorAll("[data-tf]").forEach(x => x.classList.toggle("on", x === b)); draw(); });
$("#btnNextSig").onclick = () => { stop(); const nx = day.sig.filter(s => s.m - 1 > now().m).sort((a, b) => a.m - b.m)[0];
  if (!nx) { log("今天後面沒有訊號了"); renderAll(); return; } advance(Math.max(1, idxOfM(nx.m - 1) - cur)); };

$("#btnSettings").onclick = () => { $("#setRisk").value = S.risk; $("#setHint").checked = S.hint; $("#setPause").checked = S.pause; $("#setLock").checked = S.lock; $("#dlg").showModal(); };
$("#setForm").addEventListener("submit", e => {
  S.risk = Math.max(50, parseInt($("#setRisk").value, 10) || 500); S.hint = $("#setHint").checked; S.pause = $("#setPause").checked; S.lock = $("#setLock").checked; saveSettings(); if (day) renderAll(); });
document.addEventListener("keydown", e => { if (e.target.closest("input,textarea,select,dialog")) return;
  if (e.code === "Space") { e.preventDefault(); play(); } else if (e.key === "ArrowRight") { stop(); advance(e.shiftKey ? 5 : 1); } });

// ---------- boot ----------

  .catch(() => { $("#dayTag").textContent = "資料載入失敗，請重新整理。"; });
